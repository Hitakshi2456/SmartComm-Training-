<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Case of the Missing Performance Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5fb;
  --bg-soft:#eef0f9;
  --glass:rgba(255,255,255,0.62);
  --glass-strong:rgba(255,255,255,0.82);
  --border:rgba(20,22,40,0.07);
  --border-soft:rgba(20,22,40,0.045);
  --text:#14151f;
  --text-dim:#5c6178;
  --muted:#9298ac;
  --primary:#6c5ce7;
  --primary-2:#17c3e6;
  --pink:#f472b6;
  --success:#1fbf7a;
  --danger:#f4436c;
  --warn:#f5a524;
  --accent:#6c5ce7;
  --accent-2:#17c3e6;
  --radius-lg:26px;
  --radius-md:16px;
  --shadow-sm:0 8px 24px -12px rgba(30,34,60,0.14);
  --shadow-lg:0 26px 60px -20px rgba(30,34,60,0.22);
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  position:relative;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---------- Soft ambient background ---------- */
.bg-fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.mesh{position:absolute;inset:-10%;filter:blur(70px);}
.mesh .b1{position:absolute;width:42vw;height:42vw;left:-6%;top:-8%;border-radius:50%;
  background:radial-gradient(circle, rgba(108,92,231,0.30), transparent 70%);animation:driftA 30s ease-in-out infinite;}
.mesh .b2{position:absolute;width:36vw;height:36vw;right:-6%;top:6%;border-radius:50%;
  background:radial-gradient(circle, rgba(23,195,230,0.26), transparent 70%);animation:driftB 34s ease-in-out infinite;}
.mesh .b3{position:absolute;width:32vw;height:32vw;left:22%;bottom:-12%;border-radius:50%;
  background:radial-gradient(circle, rgba(244,114,182,0.22), transparent 70%);animation:driftC 38s ease-in-out infinite;}
.mesh .b4{position:absolute;width:26vw;height:26vw;right:16%;bottom:-6%;border-radius:50%;
  background:radial-gradient(circle, rgba(31,191,122,0.18), transparent 70%);animation:driftA 24s ease-in-out infinite reverse;}
@keyframes driftA{0%,100%{transform:translate(0,0);}50%{transform:translate(4%,6%);}}
@keyframes driftB{0%,100%{transform:translate(0,0);}50%{transform:translate(-5%,4%);}}
@keyframes driftC{0%,100%{transform:translate(0,0);}50%{transform:translate(3%,-5%);}}
.grain-dots{position:absolute;inset:0;opacity:0.5;
  background-image:radial-gradient(rgba(20,22,40,0.05) 1px, transparent 1px);
  background-size:26px 26px;
  mask-image:radial-gradient(ellipse 70% 55% at 50% 15%, black 30%, transparent 85%);
}

/* ---------- HUD ---------- */
.hud{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  gap:14px;padding:12px 20px;margin:0 auto;max-width:1080px;
  background:var(--glass-strong);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid var(--border);border-top:none;
  border-radius:0 0 20px 20px;flex-wrap:wrap;box-shadow:var(--shadow-sm);
}
.hud-left{display:flex;align-items:center;gap:10px;}
.hud-cat{width:30px;height:30px;flex:0 0 auto;filter:drop-shadow(0 3px 6px rgba(108,92,231,0.35));}
.hud-name{font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--text);}
.hud-name small{display:block;font-family:var(--font-body);font-size:9.5px;color:var(--muted);font-weight:500;letter-spacing:0.02em;}
.hud-right{display:flex;gap:8px;flex-wrap:wrap;}
.hud .chip{font-size:11px;padding:6px 12px;}

/* ---------- Layout shell ---------- */
#app{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding:28px 22px 90px;}
.screen{animation:fadeUp 0.45s cubic-bezier(.2,.7,.3,1) both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.eyebrow{
  font-family:var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;
  color:var(--accent);font-size:11px;margin:0 0 8px;font-weight:600;
}
h1,h2,h3{font-family:var(--font-display);margin:0;color:var(--text);letter-spacing:-0.015em;}
.display-title{background:linear-gradient(120deg,var(--text) 10%, var(--primary) 65%, var(--primary-2) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.7);border:1px solid var(--border);
  padding:7px 13px;border-radius:999px;font-size:12.5px;color:var(--text-dim);
  font-family:var(--font-body);font-weight:600;
}
.chip b{color:var(--text);font-weight:700;}

/* ---------- Buttons (glossy 3D pill) ---------- */
.btn{
  position:relative;overflow:hidden;
  font-family:var(--font-display);font-weight:600;font-size:14.5px;letter-spacing:0.01em;
  padding:14px 28px;border-radius:16px;border:none;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;cursor:pointer;
  box-shadow:0 14px 26px -10px rgba(108,92,231,0.55), inset 0 1px 0 rgba(255,255,255,0.35), 0 1px 0 rgba(0,0,0,0.05);
  transition:transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
}
.btn:before{content:"";position:absolute;inset:0 0 55% 0;background:linear-gradient(180deg, rgba(255,255,255,0.35), transparent);pointer-events:none;}
.btn:hover{transform:translateY(-2px);filter:brightness(1.04);}
.btn:active{transform:translateY(1px);box-shadow:0 6px 14px -8px rgba(108,92,231,0.5), inset 0 1px 0 rgba(255,255,255,0.3);}
.btn.secondary{
  background:rgba(255,255,255,0.7);color:var(--text);border:1px solid var(--border);
  box-shadow:var(--shadow-sm);
}
.btn.secondary:before{display:none;}
.btn.secondary:hover{border-color:var(--accent);color:var(--accent);}
.btn:disabled{opacity:0.35;cursor:not-allowed;transform:none;box-shadow:none;filter:none;}

/* ---------- 3D tilt helper ---------- */
.tilt3d{transition:transform 0.2s cubic-bezier(.2,.7,.3,1);will-change:transform;transform-style:preserve-3d;}

/* ---------- Speech / dialogue panel ---------- */
.vn-panel{display:flex;gap:20px;align-items:center;margin-bottom:22px;flex-wrap:wrap;}
.portrait{
  flex:0 0 auto;width:106px;height:106px;border-radius:32px;position:relative;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg, rgba(255,255,255,0.9), rgba(255,255,255,0.5));
  border:1px solid var(--border);box-shadow:var(--shadow-lg);
  backdrop-filter:blur(10px);
}
.bubble-wrap{flex:1 1 260px;min-width:220px;}
.bubble{
  position:relative;background:var(--glass);border:1px solid var(--border);border-radius:20px;
  padding:16px 19px;font-family:var(--font-body);font-size:14px;line-height:1.75;color:var(--text-dim);
  min-height:52px;backdrop-filter:blur(14px);box-shadow:var(--shadow-sm);
}
.bubble .cursor{display:inline-block;width:7px;background:var(--accent);animation:blink 0.9s steps(1) infinite;margin-left:1px;}
@keyframes blink{50%{opacity:0;}}
.dots-thinking{display:flex;gap:5px;align-items:center;height:14px;}
.dots-thinking i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:dotpulse 1.1s ease-in-out infinite;}
.dots-thinking i:nth-child(2){animation-delay:0.15s;}
.dots-thinking i:nth-child(3){animation-delay:0.3s;}
@keyframes dotpulse{0%,60%,100%{opacity:0.25;transform:translateY(0);}30%{opacity:1;transform:translateY(-3px);}}
.speaker-tag{font-family:var(--font-mono);font-size:10.5px;color:var(--accent);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;font-weight:600;}

/* ---------- Intro / Cover ---------- */
.cover{
  text-align:center;padding:56px 30px 46px;border:1px solid var(--border);
  border-radius:32px;background:var(--glass);
  box-shadow:var(--shadow-lg);position:relative;overflow:hidden;backdrop-filter:blur(20px) saturate(1.3);
}
.cover-stage{
  position:relative;width:100%;max-width:300px;height:220px;margin:0 auto 26px;
  display:flex;align-items:center;justify-content:center;perspective:900px;
}
.cover-stage .disc{
  position:absolute;width:190px;height:190px;border-radius:50%;
  background:conic-gradient(from 180deg, #6c5ce7, #17c3e6, #f472b6, #1fbf7a, #6c5ce7);
  filter:blur(28px);opacity:0.35;
}
.cover-stage .cat-lg{width:150px;height:150px;position:relative;z-index:1;filter:drop-shadow(0 20px 26px rgba(30,34,60,0.25));}
.cover .sub{font-family:var(--font-body);color:var(--text-dim);font-size:15px;max-width:560px;margin:0 auto 26px;font-weight:500;}
.cover h1{font-size:clamp(28px,4.4vw,46px);line-height:1.12;margin-bottom:12px;font-weight:700;}
.brief{
  text-align:left;max-width:600px;margin:0 auto 30px;background:rgba(255,255,255,0.55);
  border:1px solid var(--border);border-radius:20px;padding:22px 24px;
  font-family:var(--font-body);font-size:14px;line-height:1.85;color:var(--text-dim);
}
.brief b{color:var(--text);}
.stamp-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:26px 0 8px;}
.stat-box{background:rgba(255,255,255,0.6);border:1px solid var(--border);border-radius:18px;padding:16px 24px;min-width:108px;box-shadow:var(--shadow-sm);}
.stat-box .n{font-family:var(--font-display);font-size:26px;font-weight:700;background:linear-gradient(120deg,var(--primary),var(--primary-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.stat-box .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-top:4px;font-weight:600;}

/* ---------- Case Board (level map / track) ---------- */
.board-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
.progressbar{height:8px;border-radius:999px;background:rgba(20,22,40,0.06);overflow:hidden;}
.progressbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-2));transition:width 0.4s ease;}

.evidence-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;}
.evidence-row .chip{background:rgba(255,255,255,0.7);}
.keychain{display:flex;gap:7px;flex-wrap:wrap;}
.key-slot{
  width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#fff,#eef0fb);border:1px solid var(--border);font-size:13.5px;color:var(--text);font-family:var(--font-mono);font-weight:700;
  box-shadow:0 4px 10px -4px rgba(108,92,231,0.35);
}

.board-wrap{
  position:relative;margin-top:22px;border:1px solid var(--border);border-radius:var(--radius-lg);
  background:var(--glass);box-shadow:var(--shadow-lg);backdrop-filter:blur(16px);
  padding-bottom:68%;
}
.board-inner{position:absolute;inset:0;}
.board-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.node{
  position:absolute;transform:translate(-50%,-50%);width:74px;height:74px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;text-align:center;z-index:3;
}
.node .seal{
  width:52px;height:52px;border-radius:20px;display:flex;align-items:center;justify-content:center;
  font-size:21px;position:relative;transition:transform 0.2s ease, box-shadow 0.2s ease;
}
.node .seal:after{
  content:"";position:absolute;bottom:-13px;left:50%;width:30px;height:9px;transform:translateX(-50%);
  background:radial-gradient(ellipse, rgba(20,22,40,0.22), transparent 72%);filter:blur(1.5px);z-index:-1;
}
.node .lbl{font-size:9.5px;margin-top:9px;font-family:var(--font-body);font-weight:600;letter-spacing:0.01em;color:var(--text-dim);max-width:88px;line-height:1.25;}
.node .num{
  position:absolute;top:-4px;right:-4px;width:19px;height:19px;border-radius:50%;background:#fff;
  border:1px solid var(--border);font-family:var(--font-mono);font-size:9.5px;font-weight:700;color:var(--text-dim);
  display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px -2px rgba(20,22,40,0.25);z-index:2;
}
.node.locked .seal{background:rgba(20,22,40,0.05);}
.node.locked .seal:after{opacity:0.5;}
.node.locked{cursor:not-allowed;}
.node.locked .lbl{color:var(--muted);}
.node.current .seal{color:#fff;animation:float3d 2.4s ease-in-out infinite;}
.node.current .seal:before{
  content:"";position:absolute;inset:-7px;border-radius:24px;border:2px solid color-mix(in srgb, var(--accent) 45%, transparent);
  animation:ringpulse 1.8s ease-out infinite;
}
@keyframes ringpulse{0%{transform:scale(0.85);opacity:0.9;}100%{transform:scale(1.35);opacity:0;}}
.node.current:hover .seal{transform:scale(1.08);}
.node.correct .seal{background:linear-gradient(150deg,#4fe3ab,var(--success));color:#04241a;box-shadow:0 10px 20px -6px rgba(31,191,122,0.5);}
.node.incorrect .seal{background:linear-gradient(150deg,#ff8fa3,var(--danger));color:#3a0410;box-shadow:0 10px 20px -6px rgba(244,67,108,0.5);}
@keyframes float3d{0%,100%{transform:translateY(0) rotateX(0deg);}50%{transform:translateY(-6px) rotateX(6deg);}}

.route-marker{
  position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:14px;z-index:2;pointer-events:none;
  background:rgba(255,255,255,0.75);border:1px solid var(--border);box-shadow:var(--shadow-sm);
}
.route-marker.finish.reached{background:linear-gradient(150deg,var(--primary-2),var(--primary));color:#fff;box-shadow:0 10px 20px -6px rgba(108,92,231,0.55);}
.route-marker .rm-lbl{position:absolute;top:34px;font-size:8.5px;font-family:var(--font-mono);font-weight:600;color:var(--muted);white-space:nowrap;letter-spacing:0.06em;text-transform:uppercase;}

.cat-token{position:absolute;width:44px;height:44px;transform:translate(-50%,-108%);z-index:10;pointer-events:none;}
.cat-token .bob{animation:bob 1.5s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(30,34,60,0.28));}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.cat-token.walking .bob{animation:walkbob 0.35s ease-in-out infinite;}
@keyframes walkbob{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-8px) rotate(3deg);}}

/* ---------- Room screen ---------- */
.room-shell{max-width:780px;margin:0 auto;}
.room-scene{
  position:relative;border-radius:var(--radius-lg);overflow:hidden;margin-bottom:18px;
  background:linear-gradient(165deg, color-mix(in srgb, var(--accent) 10%, white), rgba(255,255,255,0.7) 60%);
  border:1px solid var(--border);padding:30px 28px 26px;backdrop-filter:blur(16px);box-shadow:var(--shadow-lg);
}
.room-tag{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.room-tag .badge3d{
  width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;
  background:linear-gradient(150deg,#fff,color-mix(in srgb, var(--accent) 35%, white));
  box-shadow:0 6px 12px -4px color-mix(in srgb, var(--accent) 60%, transparent);
}
.room-tag .topic{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--accent);font-family:var(--font-mono);font-weight:700;}
.room-scene h2{font-size:24px;margin:6px 0 20px;font-weight:700;}

.room-card{
  border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--glass-strong);
  box-shadow:var(--shadow-lg);padding:28px 30px 28px;position:relative;overflow:hidden;backdrop-filter:blur(16px);
}
.problem{
  background:rgba(255,255,255,0.6);border:1px solid var(--border);border-radius:16px;
  padding:17px 19px;font-size:15px;font-weight:600;margin-bottom:20px;color:var(--text);
  border-left:3px solid var(--accent);font-family:var(--font-body);line-height:1.6;
}
.options{display:flex;flex-direction:column;gap:10px;margin-bottom:6px;}
.opt{
  display:flex;align-items:flex-start;gap:13px;padding:15px 18px;border-radius:16px;
  border:1px solid var(--border);background:rgba(255,255,255,0.45);cursor:pointer;
  font-size:14.5px;line-height:1.5;transition:border-color 0.15s ease, background 0.15s ease, transform 0.12s ease, box-shadow 0.15s ease;
}
.opt:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-sm);background:rgba(255,255,255,0.65);}
.opt .k{
  flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:rgba(20,22,40,0.045);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--accent);
}
.opt.selected{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 10%, white);}
.opt.correct{border-color:var(--success);background:rgba(31,191,122,0.1);}
.opt.wrong{border-color:var(--danger);background:rgba(244,67,108,0.1);}
.opt.disabled{cursor:default;}
.opt.disabled:hover{transform:none;box-shadow:none;}

.feedback{margin-top:18px;padding:19px 21px;border-radius:18px;border:1px solid var(--border);background:rgba(255,255,255,0.55);}
.feedback .head{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:16px;margin-bottom:9px;font-weight:700;}
.feedback.ok .head{color:var(--success);}
.feedback.bad .head{color:var(--danger);}
.feedback p{margin:0 0 11px;font-size:13.5px;line-height:1.65;color:var(--text-dim);}
.clue-reveal{
  display:flex;align-items:center;gap:13px;background:rgba(255,255,255,0.6);
  border:1px solid var(--border);border-radius:16px;padding:12px 16px;margin-top:9px;
}
.clue-reveal .cchip{
  width:40px;height:40px;border-radius:12px;background:linear-gradient(150deg,var(--primary-2),var(--primary));
  display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:17px;color:#fff;
  flex:0 0 auto;box-shadow:0 8px 16px -6px rgba(108,92,231,0.5);
}
.clue-reveal .ctext{font-size:12.5px;color:var(--text-dim);}
.clue-reveal .ctext b{color:var(--text);font-family:var(--font-mono);}

.room-foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px;flex-wrap:wrap;}

.flash-ok{animation:flashok 0.6s ease;}
.flash-bad{animation:flashbad 0.5s ease;}
@keyframes flashok{0%{box-shadow:var(--shadow-lg);}30%{box-shadow:0 0 0 3px rgba(31,191,122,0.35), var(--shadow-lg);}100%{box-shadow:var(--shadow-lg);}}
@keyframes flashbad{0%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}100%{transform:translateX(0);}}

/* ---------- Case Review / Score screen ---------- */
.review-card{text-align:center;padding:44px 30px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--glass);box-shadow:var(--shadow-lg);backdrop-filter:blur(18px);}
.score-ring{width:154px;height:154px;margin:12px auto 20px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;}
.score-ring svg{position:absolute;inset:0;transform:rotate(-90deg);}
.score-ring .num{font-family:var(--font-display);font-size:36px;color:var(--text);font-weight:700;}
.score-ring .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;position:absolute;bottom:40px;font-weight:600;}
.rank-badge{display:inline-block;padding:9px 20px;border-radius:999px;color:#fff;font-family:var(--font-display);font-weight:600;font-size:13px;margin-bottom:18px;
  background:linear-gradient(120deg,var(--primary),var(--primary-2));box-shadow:0 10px 22px -8px rgba(108,92,231,0.5);}

/* ---------- Vault ---------- */
.vault-wrap{max-width:620px;margin:0 auto;text-align:center;}
.vault-door{
  width:180px;height:180px;margin:0 auto 22px;border-radius:50%;position:relative;perspective:800px;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,0.9), rgba(238,240,251,0.5) 60%);
  border:1px solid var(--border);box-shadow:var(--shadow-lg);
  display:flex;align-items:center;justify-content:center;
}
.vault-door.shaking{animation:flashbad 0.4s ease;}
.vault-door:before{content:"";position:absolute;inset:12px;border-radius:50%;border:2px dashed color-mix(in srgb, var(--accent) 40%, transparent);animation:spin 24s linear infinite;}

   IDENTITY (plain email, no OAuth) + DATA (Google Sheets via Apps Script)
   ---------------------------------------------------------
   1) Create a Google Sheet, open Extensions → Apps Script, paste in
      the Code.gs provided alongside this file, and deploy it as a
      Web App (Execute as: Me, Who has access: Anyone). Copy the
      /exec URL it gives you into APPS_SCRIPT_URL below.
   2) (Optional) Set ALLOWED_EMAIL_DOMAIN to restrict entries to your
      company's domain, e.g. "yourcompany.com". Leave "" to allow any.

   Note on identity: this only asks for an email address — it does not
   verify the person actually owns it. That's a deliberate simplicity
   tradeoff for a low-stakes internal quiz. The "one attempt per email"
   rule is still enforced server-side in Code.gs, so nobody can get a
   second *completed* result for the same email — but nothing stops
   someone from typing a different (or someone else's) email to get

const APPS_SCRIPT_URL = "$2a$10$PMdozL3O4gHTJa4SYYuASuWhcYF/ojCUaSeOr3yJegHpxyJQuJdga"; // ends in /exec
const ALLOWED_EMAIL_DOMAIN = ""; // e.g. "yourcompany.com" — "" allows any domain
const SAVED_EMAIL_KEY = "smartcomm_user_email";

function isValidEmail(email){
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return false;
  if(ALLOWED_EMAIL_DOMAIN && !email.toLowerCase().endsWith("@"+ALLOWED_EMAIL_DOMAIN.toLowerCase())) return false;
  return true;
}
function nameFromEmail(email){
  const local = email.split("@")[0] || email;
  return local.replace(/[._-]+/g," ").trim().split(" ")
    .filter(Boolean).map(w=> w[0].toUpperCase()+w.slice(1)).join(" ") || email;
}
function saveEmail(email){ try{ localStorage.setItem(SAVED_EMAIL_KEY, email); }catch(e){} }
function loadSavedEmail(){ try{ return localStorage.getItem(SAVED_EMAIL_KEY); }catch(e){ return null; } }
function clearSavedEmail(){ try{ localStorage.removeItem(SAVED_EMAIL_KEY); }catch(e){} }

async function apiCheckEmail(email){
  const res = await fetch(`${APPS_SCRIPT_URL}?action=checkEmail&email=${encodeURIComponent(email)}`);
  return res.json();
}
// text/plain avoids a CORS preflight that Apps Script Web Apps don't handle well.
async function apiStart(email, displayName){
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action:"start", email, displayName })
  });
  return res.json();
}
async function apiComplete(email, payload){
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action:"complete", email, ...payload })
  });
  return res.json();
}

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* ---- 3D tilt interaction for hero/product visuals ---- */
function enableTilt(){
  document.querySelectorAll(".tilt3d").forEach(el=>{
    if(el.dataset.tiltBound) return;
    el.dataset.tiltBound = "1";
    el.addEventListener("mousemove",(e)=>{
      const r = el.getBoundingClientRect();
      const px = (e.clientX - r.left)/r.width - 0.5;
      const py = (e.clientY - r.top)/r.height - 0.5;
      el.style.transform = `perspective(700px) rotateX(${(-py*12).toFixed(2)}deg) rotateY(${(px*12).toFixed(2)}deg)`;
    });
    el.addEventListener("mouseleave",()=>{
      el.style.transform = "perspective(700px) rotateX(0deg) rotateY(0deg)";
    });
  });
}

/* ---------------- CASE BOARD (level map / track) ---------------- */
function nodePositions(n){
  const pts=[];
  for(let i=0;i<n;i++){
    const t=i/(n-1);
    const x=50 + 30*Math.sin(i*1.35);
    const y=11 + t*78;
    pts.push({x:Math.max(14,Math.min(86,x)), y});
  }
  return pts;
}

/* Catmull-Rom -> cubic Bezier control points for a smooth flowing curve
   through p1..p2, using neighbours p0/p3 as tangent guides. */
function curveSeg(p0,p1,p2,p3){
  const cp1x = p1.x + (p2.x-p0.x)/6;
  const cp1y = p1.y + (p2.y-p0.y)/6;
  const cp2x = p2.x - (p3.x-p1.x)/6;
  const cp2y = p2.y - (p3.y-p1.y)/6;
  return `C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2.x} ${p2.y}`;
}

/* Builds one continuous, smoothly-curved road: vivid gradient where the
   detective has already walked, soft dashed grey for the road still ahead —
   plus a start flag and a vault marker at the finish so the path visibly
   leads somewhere. */
function buildRoute(pts, traveled, allDone){
  const start = {x: pts[0].x - 4, y: Math.max(3, pts[0].y - 6)};
  const finish = {x: pts[pts.length-1].x, y: Math.min(96, pts[pts.length-1].y + 8)};
  const ext = [start, ...pts, finish];

  let defs = "";
  let body = "";
  for(let i=0;i<ext.length-1;i++){
    const p0 = ext[i-1] || ext[i];
    const p1 = ext[i];
    const p2 = ext[i+1];
    const p3 = ext[i+2] || p2;
    const d = `M ${p1.x} ${p1.y} ${curveSeg(p0,p1,p2,p3)}`;
    const realIdx = i-1; // room-to-room segment index; <0 = start->room0, >=len-1 = last room->finish
    let vivid, colorA, colorB;
    if(realIdx < 0){
      vivid = true; colorA = ROOMS[0].accent; colorB = ROOMS[0].accent;
    } else if(realIdx >= pts.length-1){
      vivid = allDone; colorA = ROOMS[ROOMS.length-1].accent; colorB = "#6c5ce7";
    } else {
      vivid = realIdx < traveled;
      colorA = ROOMS[realIdx].accent; colorB = ROOMS[realIdx+1].accent;
    }
    if(vivid){
      const gid = `routeGrad${i}`;
      defs += `<linearGradient id="${gid}" x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="${colorA}"/><stop offset="100%" stop-color="${colorB}"/>
      </linearGradient>`;
      body += `<path d="${d}" fill="none" stroke="${colorA}" stroke-width="11" stroke-linecap="round" opacity="0.16" vector-effect="non-scaling-stroke"/>`;
      body += `<path d="${d}" fill="none" stroke="url(#${gid})" stroke-width="4" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
    } else {
      body += `<path d="${d}" fill="none" stroke="#d7dae8" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="0.5 8" vector-effect="non-scaling-stroke"/>`;
    }
  }
  return { svg: `<defs>${defs}</defs>${body}`, start, finish };
}

function renderBoard(){
  const pts=nodePositions(ROOMS.length);
  const nextIdx = state.answers.findIndex(a=>a===null);
  const allDone = nextIdx===-1;
  // The cat always stands on the current (next unanswered) question's node —
  // right or wrong doesn't matter, it never lags behind or skips ahead.
  const catTargetIdx = Math.min(allDone ? ROOMS.length-1 : nextIdx, pts.length-1);
  const catNode = state.animateWalkFrom!==null ? state.animateWalkFrom : catTargetIdx;
  const currentAccent = nextIdx>=0 ? ROOMS[nextIdx].accent : (ROOMS[ROOMS.length-1].accent);
  const traveled = catTargetIdx;

  const route = buildRoute(pts, traveled, allDone);

  const nodesHtml = pts.map((p,i)=>{
    const answered = state.answers[i];
    let cls="locked";
    if(answered===true) cls="correct";
    else if(answered===false) cls="incorrect";
    else if(i===nextIdx) cls="current";
    const clickable = (i===nextIdx);
    const sealStyle = cls==="current" ? `style="background:linear-gradient(150deg,${ROOMS[i].accent},color-mix(in srgb, ${ROOMS[i].accent} 60%, #6c5ce7));box-shadow:0 14px 24px -8px ${ROOMS[i].accent}99;"` : "";
    return `
    <div class="node ${cls} ${cls==='current'?'tilt3d':''}" style="left:${p.x}%; top:${p.y}%;" data-idx="${i}" ${clickable? `tabindex="0" role="button" aria-label="Open room ${ROOMS[i].code}: ${ROOMS[i].place}"` : "aria-disabled='true'"}>
      <div class="seal" ${sealStyle}>${answered===true? "✔" : answered===false? "✖" : (cls==="current"? ROOMS[i].icon : "🔒")}</div>
      <div class="num">${ROOMS[i].code}</div>
      <div class="lbl">${ROOMS[i].place}</div>
    </div>`;
  }).join("");

  const catPt = pts[catNode] || pts[0];
  const gotClues = ROOMS.filter((r,i)=>state.answers[i]===true);
  const keychainHtml = gotClues.map(r=>`<div class="key-slot" title="${r.clueLabel||('Fragment '+r.clueValue)}">${r.clueValue}</div>`).join("");

  app.innerHTML = `
  ${hudHtml(currentAccent)}
  <div class="screen">
    <div class="board-head">
      <div>
        <p class="eyebrow">Investigation Track</p>
        <h2>Room ${Math.min(nextIdx===-1?ROOMS.length:nextIdx+1, ROOMS.length)} of ${ROOMS.length}${nextIdx>=0? " — "+ROOMS[nextIdx].place : ""}</h2>
      </div>
    </div>
    <div class="progressbar"><i style="width:${(traveled/(ROOMS.length-1||1))*100}%"></i></div>

    <div class="evidence-row">
      <span class="chip">Evidence <b>${gotClues.length}/${ROOMS.length}</b></span>
      <div class="keychain">${keychainHtml}</div>
    </div>

    <div class="board-wrap">
      <div class="board-inner">
        <svg class="board-svg" viewBox="0 0 100 100" preserveAspectRatio="none">${route.svg}</svg>
        <div class="route-marker" style="left:${route.start.x}%; top:${route.start.y}%;">🐾<span class="rm-lbl">Start</span></div>
        <div class="route-marker finish ${allDone?'reached':''}" style="left:${route.finish.x}%; top:${route.finish.y}%;">🔐<span class="rm-lbl">Vault</span></div>
        ${nodesHtml}
        <div class="cat-token" id="catToken" style="left:${catPt.x}%; top:${catPt.y}%;"><div class="bob">${catTokenSVG(currentAccent)}</div></div>
      </div>
    </div>

    ${allDone? `<div style="text-align:center;margin-top:28px;"><button class="btn" id="reviewBtn">Close Investigation &amp; Review Case →</button></div>` : ""}
    <footer class="credit">Tap the glowing room to continue the track — ${CAT_NAME} will follow.</footer>
  </div>`;

  document.querySelectorAll(".node.current").forEach(el=>{
    const openRoom = ()=>{ state.roomIdx=parseInt(el.dataset.idx); state.selected=null; state.submitted=false; state.screen="room"; render(); };
    el.onclick=openRoom;
    el.onkeydown=(e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openRoom(); } };
  });
  if(allDone){
    document.getElementById("reviewBtn").onclick=()=>{ state.screen="review"; render(); };
  }

  if(state.animateWalkFrom!==null){
    const token = document.getElementById("catToken");
    const targetPt = pts[catTargetIdx];
    token.classList.add("walking");
    requestAnimationFrame(()=>{
      token.style.transition = "left 0.9s cubic-bezier(.3,.7,.3,1), top 0.9s cubic-bezier(.3,.7,.3,1)";
      token.style.left = targetPt.x+"%";
      token.style.top = targetPt.y+"%";
    });
    setTimeout(()=>{
      state.animateWalkFrom=null;
      token.classList.remove("walking");
    }, 950);
  }
}

/* ---------------- ROOM ---------------- */
function typewriter(el, text, speed){
  let i=0; el.innerHTML="";
  const cursor = document.createElement("span");
  cursor.className="cursor";
  function step(){
    if(i<=text.length){
      el.textContent = text.slice(0,i);
      el.appendChild(cursor);
      i++;
      requestAnimationFrame(()=> setTimeout(step, speed));
    } else {
      cursor.remove();
    }
  }
  step();
}

function renderMainFeedback(r, isCorrect, onContinue){
  const card = document.getElementById("roomCard");

    else if(i===state.selected) el.classList.add("wrong");
  });
  document.getElementById("submitBtn").remove();
  const clueLabelText = r.clueType==="item" ? r.clueLabel : (r.clueType==="letter"?"Letter":"Number") + ` "${r.clueValue}"`;
  const quip = isCorrect ? pick(CORRECT_QUIPS) : pick(WRONG_QUIPS);
  document.getElementById("feedbackWrap").innerHTML = `
    <div class="feedback ${isCorrect?"ok":"bad"}">
      <div class="head">${isCorrect? "✅ Case Cracked" : "❌ Not Quite, Detective"}</div>
      <p><em>"${quip}"</em> — ${CAT_NAME}</p>
      <p>${r.explanation}</p>
      ${isCorrect? `
      <div class="clue-reveal">
        <div class="cchip">${r.clueValue}</div>
        <div class="ctext"><b>${clueLabelText}</b> recovered.<br>${r.clueFlavor}</div>

      <div class="clue-reveal" style="border-color:var(--danger);">
        <div class="cchip" style="background:linear-gradient(150deg,#ff8fa3,var(--danger));">–</div>
        <div class="ctext">No clue recovered this time — the correct answer above is now on record. Keep walking the track.</div>
      </div>`}
    </div>`;
  const foot = document.querySelector(".room-foot");
  const cont = document.createElement("button");
  cont.className="btn"; cont.textContent="Continue Down the Track →";
  cont.onclick=onContinue;
  foot.appendChild(cont);
}

      </div>
      <div class="rank-badge">🏅 ${rankFor(pct)}</div>
      <div style="width:90px;height:90px;margin:0 auto 16px;" class="tilt3d">${catSVG({accent:pass?'#1fbf7a':'#f4436c', mood:pass?"happy":"sad"})}</div>
      <h2 style="margin-bottom:12px;">${pass? "Threshold Cleared — The Vault Awaits" : "Threshold Missed — A Hidden Zone Beckons"}</h2>
      <p style="color:var(--text-dim);max-width:480px;margin:0 auto 22px;font-size:14.5px;line-height:1.7;">
        ${pass
          ? `"${pick(CORRECT_QUIPS)}" You've gathered enough evidence to proceed directly to the Report Vault.`
          : `"${pick(WRONG_QUIPS)}" You've fallen just short of the 70% pass mark. A hidden Diagnostics Zone has opened — solve 3 more challenges for a second chance at the Vault.`}
      </p>
      <button class="btn" id="proceedBtn">${pass? "Proceed to the Report Vault →" : "Enter the Diagnostics Zone →"}</button>
      <div style="margin-top:16px;"><button class="btn secondary" id="backBoardBtn2">Review Case Track</button></div>
    </div>
  </div>`;
  document.getElementById("proceedBtn").onclick=()=>{
    if(pass){ state.screen="vault"; }
    else { state.screen="bonusIntro"; }
    render();
  };
  document.getElementById("backBoardBtn2").onclick=()=>{ state.screen="board"; render(); };
}

/* ---------------- BONUS ZONE ---------------- */
function renderBonusIntro(){
  app.innerHTML = `
  ${hudHtml('#f4436c')}
  <div class="screen">
    <div class="cover">
      <div style="width:108px;height:108px;margin:0 auto 16px;" class="tilt3d">${catSVG({accent:"#f4436c", mood:"idle"})}</div>
      <h1 class="display-title" style="font-size:clamp(22px,3.4vw,32px);">The Hidden Diagnostics Zone</h1>
      <p class="brief" style="text-align:left;">
        A concealed panel has opened behind the Case Track. Inside: <b>3 additional SmartComm Operate challenges</b>, each covering a feature the client will expect your team to know cold. Solve them, and you'll earn a <b>second chance</b> at the Report Vault — regardless of your first attempt.
      </p>
      <button class="btn" id="startBonus">Enter the Mystery Zone →</button>
    </div>
  </div>`;
  document.getElementById("startBonus").onclick=()=>{
    state.bonusIdx=0; state.selected=null; state.submitted=false; state.screen="bonusRoom"; render();
  };
}

function renderBonusRoom(){
  const r = BONUS[state.bonusIdx];
  setAccent(r.accent, '#17c3e6');
  app.innerHTML = `
  ${hudHtml(r.accent)}
  <div class="screen room-shell">
    <div class="bonus-banner">⚠ Hidden Zone &middot; Challenge ${state.bonusIdx+1} of ${BONUS.length} &middot; Second-Chance Track</div>
    <div class="room-scene">
      <div class="room-tag"><span class="badge3d">${r.icon}</span><span class="topic">${r.place}</span></div>
      <h2>${r.title}</h2>
      <div class="vn-panel">
        <div class="portrait tilt3d">${catSVG({accent:r.accent, mood:"think"})}</div>
        <div class="bubble-wrap">
          <div class="speaker-tag">${CAT_NAME}</div>
          <div class="bubble" id="narrativeBubble"><div class="dots-thinking"><i></i><i></i><i></i></div></div>
        </div>
      </div>
    </div>
    <div class="room-card" id="roomCard">
      <div class="problem">🔍 ${r.problem}</div>
      <div class="options" id="optionsWrap">
        ${r.options.map((opt,i)=>`
          <div class="opt" data-i="${i}" tabindex="0" role="button">
            <span class="k">${String.fromCharCode(65+i)}</span>
            <span>${opt}</span>
          </div>`).join("")}
      </div>
      <div id="feedbackWrap"></div>
      <div class="room-foot">
        <span></span>
        <button class="btn" id="submitBtn" disabled>Submit Answer</button>
      </div>
    </div>
  </div>`;

  setTimeout(()=> typewriter(document.getElementById("narrativeBubble"), r.narrative, 11), 350);

  const selectBonusOpt = (el)=>{
    document.querySelectorAll("#optionsWrap .opt").forEach(o=>o.classList.remove("selected"));
    el.classList.add("selected");
    state.selected = parseInt(el.dataset.i);
    document.getElementById("submitBtn").disabled=false;
  };
  document.querySelectorAll("#optionsWrap .opt").forEach(el=>{
    el.onclick=()=> selectBonusOpt(el);
    el.onkeydown=(e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); selectBonusOpt(el); } };
  });

  document.getElementById("submitBtn").onclick=()=>{
    if(state.selected===null) return;
    const isCorrect = state.selected===r.correct;
    state.bonusAnswers[state.bonusIdx]=isCorrect;
    document.getElementById("roomCard").classList.add(isCorrect?"flash-ok":"flash-bad");
    document.querySelectorAll("#optionsWrap .opt").forEach(el=>{
      const i=parseInt(el.dataset.i);
      el.classList.add("disabled");
      if(i===r.correct) el.classList.add("correct");
      else if(i===state.selected) el.classList.add("wrong");
    });
    document.getElementById("submitBtn").remove();
    document.getElementById("feedbackWrap").innerHTML = `
      <div class="feedback ${isCorrect?"ok":"bad"}">
        <div class="head">${isCorrect? "✅ Detail Confirmed" : "❌ Recorded — Correct Answer Above"}</div>
        <p>${r.explanation}</p>
      </div>`;
    const foot = document.querySelector(".room-foot");
    const cont = document.createElement("button");
    cont.className="btn";
    const isLast = state.bonusIdx===BONUS.length-1;
    cont.textContent = isLast? "Attempt the Vault Again →" : "Next Challenge →";
    cont.onclick=()=>{
      if(isLast){
        state.secondChance=true;
        state.screen="vault";
      } else {
        state.bonusIdx++; state.selected=null;
        state.screen="bonusRoom";
      }
      render();
    };
    foot.appendChild(cont);
  };
}

/* ---------------- VAULT ---------------- */
function renderVault(){
  const clues = collectedClues();
  const fragHtml = clues.map(c=>{
    const isItem = c.clueType==="item";
    return `<div class="frag ${isItem?"item":""}" title="${c.title}">${c.clueValue}</div>`;
  }).join("") || `<p style="color:var(--muted);font-size:13px;">No fragments recovered — but the passcode is still crackable if you know your SmartComm Operate.</p>`;

  app.innerHTML = `
  ${hudHtml('#6c5ce7')}
  <div class="screen vault-wrap">
    ${state.secondChance? `<div class="bonus-banner">🔁 Second-chance attempt via the Diagnostics Zone</div>` : ""}
    <p class="eyebrow">The Report Vault</p>
    <h2 style="margin-bottom:8px;">Assemble Your Evidence</h2>
    <div style="width:86px;height:86px;margin:12px auto;" class="tilt3d">${catSVG({accent:"#6c5ce7", mood:"idle"})}</div>
    <p style="color:var(--text-dim);font-size:14px;max-width:480px;margin:8px auto 20px;">
      Arrange the recovered fragments in the order they were found. Together, they form the vault's passcode.
    </p>
    <div class="vault-door tilt3d" id="vaultDoor"><span class="wheel">🔒</span></div>
    <div class="fragments">${fragHtml}</div>
    <div>
      <input id="vaultInput" class="passcode-input" maxlength="12" placeholder="ENTER CODE" value="${state.vaultInput}">
    </div>
    <p class="hint">Hint: 7 characters, all-uppercase, no spaces — spelled from the clues above.</p>
    ${state.vaultError? `<p style="color:var(--danger);font-size:13px;margin-bottom:12px;">✖ Incorrect passcode. The vault remains sealed — check your evidence and try again.</p>` : ""}
    <div>
      <button class="btn" id="unlockBtn">Unlock the Vault →</button>
    </div>
    <div style="margin-top:16px;"><button class="btn secondary" id="backBoardBtn3">← Back to Case Track</button></div>
  </div>`;

  const input = document.getElementById("vaultInput");
  input.oninput = (e)=>{ state.vaultInput = e.target.value.toUpperCase(); e.target.value = state.vaultInput; };
  document.getElementById("unlockBtn").onclick=()=>{
    const normalized = state.vaultInput.replace(/[\s-]/g,"").toUpperCase();
    if(normalized===PASSCODE){
      state.vaultError=false;
      state.screen="certificate"; render();
    } else {
      state.vaultError=true;
      render();
      document.getElementById("vaultDoor").classList.add("shaking");
    }
  };
  document.getElementById("backBoardBtn3").onclick=()=>{ state.screen="board"; render(); };
}

/* ---------------- CERTIFICATE ---------------- */
function renderCertificate(){
  const colors=["#6c5ce7","#17c3e6","#1fbf7a","#f5a524","#f4436c"];
  let confetti="";
  for(let i=0;i<40;i++){
    const left = Math.random()*100;
    const delay = Math.random()*3;
    const dur = 3+Math.random()*3;
    const color = colors[i%colors.length];
    confetti += `<i style="left:${left}%;background:${color};animation-delay:${delay}s;animation-duration:${dur}s;"></i>`;
  }

  // Record the final result once per account — this is what makes the
  // login gate's "one attempt" rule stick on the next sign-in.
  if(state.user && !state.resultSaved){
    state.resultSaved = true;
    apiComplete(state.user.email, {
      displayName: state.user.name || "",
      score: scorePct(),
      correctCount: correctCount(),
      totalRooms: ROOMS.length,
      rank: rankFor(scorePct()),
      secondChance: state.secondChance,
      roomAnswers: state.answers,
      bonusAnswers: state.secondChance ? state.bonusAnswers : []
    }).catch(err=>console.error("Failed to save result to the sheet:", err));
  }

  app.innerHTML = `
  ${hudHtml('#1fbf7a')}
  <div class="screen">
    <div class="cert">
      <div class="confetti">${confetti}</div>
      <div class="medal3d tilt3d">🏆</div>
      <p class="eyebrow">Case Closed &middot; Vault Unlocked</p>
      <h1 class="display-title">SmartComm Report<br>Successfully Recovered</h1>
      <div style="width:106px;height:106px;margin:10px auto;" class="tilt3d">${catSVG({accent:"#1fbf7a", mood:"happy"})}</div>
      <p style="max-width:480px;margin:16px auto 22px;color:var(--text-dim);font-size:15px;line-height:1.8;">
        The passcode <b style="color:var(--text);letter-spacing:0.1em;font-family:var(--font-mono);">${PASSCODE}</b> has unlocked the Report Vault. Every clue you gathered — from a silent gateway to an unread alert — pointed to the same truth: good operations aren't about watching dashboards, they're about acting on what they already tell you.
      </p>
      <div class="rank-badge">🏅 Certified Platform Detective</div>
      <p style="max-width:460px;margin:12px auto 26px;color:var(--text-dim);font-size:13.5px;font-family:var(--font-body);line-height:1.8;font-style:italic;">
        "The platform was never the mystery. The mystery was who was actually looking at it." — ${CAT_NAME}
      </p>
      <div class="badge-strip" style="justify-content:center;display:flex;gap:8px;flex-wrap:wrap;">
        <span class="chip">Final Score <b>${scorePct()}%</b></span>
        <span class="chip">Rank <b>${rankFor(scorePct())}</b></span>
        ${state.secondChance? `<span class="chip">Path <b>Second Chance</b></span>` : `<span class="chip">Path <b>Direct Clear</b></span>`}
      </div>
      <p style="margin-top:22px;color:var(--muted);font-size:12px;">
        Your result has been recorded under <b>${state.user? state.user.email : "this account"}</b>. This attempt is now locked.
      </p>
      <div style="margin-top:14px;">
        <button class="btn secondary" id="signOutBtn3">Switch Email</button>
      </div>
    </div>
    <footer class="credit">SmartComm Operate Academy &middot; Platform Diagnostics Training Simulation</footer>
  </div>`;
  const signOutBtn = document.getElementById("signOutBtn3");
  if(signOutBtn) signOutBtn.onclick = async ()=>{ await doSignOut(); };
}

/* =========================================================
   IDENTITY BOOTSTRAP
   Drives which screen shows based on whether an email is already
   remembered in this browser, and whether that email already has
   a completed attempt on file.
========================================================= */
render(); // shows the "checking" screen immediately while we look up any saved email

async function routeSignedInUser(user){
  state.user = user;
  try{
    const check = await apiCheckEmail(user.email);
    if(check.exists && check.status === "completed"){
      state.priorResult = check.data;
      state.screen = "alreadyDone";
    } else {
      // First time in (or a previously abandoned, incomplete attempt) — let them play.
      apiStart(user.email, user.name).catch(err=>console.error("Failed to log attempt start:", err));
      state.screen = "intro";
    }
  }catch(err){
    console.error("Could not reach the results sheet:", err);
    // Fail open rather than lock a legitimate user out over a network hiccup.
    state.screen = "intro";
  }
  render();
}

(async ()=>{
  const savedEmail = loadSavedEmail();
  if(!savedEmail){
    state.screen = "login";
    render();
    return;
  }
  await routeSignedInUser({ email: savedEmail, name: nameFromEmail(savedEmail) });
})();
</script>
